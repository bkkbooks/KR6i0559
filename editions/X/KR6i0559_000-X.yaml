front:
  text: 大方廣圓覺經略鈔序吳門傳教臨壇賜紫明義大師思齊述修身者何戒律而已矣融心者何圓覺而已矣始嚴戒律終顯圓覺并是二者予猥受於先淨慧大師其諱善政門焉姑以所聞從事兼講指歸途於晚歲樂圓覺為要說其祖演章句即圭峯定慧禪師略疏二卷略鈔六卷疏以通經鈔以通疏探𧷤而索隱辭簡而義博則備之裴相國序道固師是流至于今今之駕說者莫不以茲鈔為司南乎思齊懵昧幸敷斯教當懼聖言紛於水鶴切慮傳者駮於魯魚因與武林法師仲希諮度眾本訪對輿典循尊古卑今之致竊及史闕文之旨約定元鈔將事刊勒門人子章力模方板僶俛揮振庸詎是非非也不削則削是也乃本其本後將斯文而覺世者無以不繼志而罪我乎如志我者則庶幾乎如來圓覺耀無窮矣圭峯章句導無極矣時皇宋康定二年辛巳歲杓建鶉咮月望日謹序
